name: Deploy ok-berlin theme

on:
  push:
    branches:
      - main
    paths:
      - "ok-berlin/app/public/wp-content/themes/okberlin/**"
  workflow_dispatch:

concurrency:
  group: deploy-ok-berlin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.OK_BERLIN_SSH_HOST }}
      SSH_USER: ${{ secrets.OK_BERLIN_SSH_USER }}
      SSH_PASSWORD: ${{ secrets.OK_BERLIN_SSH_PASSWORD }}
      SSH_PORT: ${{ secrets.OK_BERLIN_SSH_PORT || '2222' }}
      WP_ROOT: ${{ secrets.OK_BERLIN_WP_ROOT }}
      THEME_NAME: okberlin
      LOCAL_THEME: ok-berlin/app/public/wp-content/themes/okberlin
      SSH_OPTS: "-o BatchMode=no -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SSH_HOST:OK_BERLIN_SSH_HOST"
            "SSH_USER:OK_BERLIN_SSH_USER"
            "SSH_PASSWORD:OK_BERLIN_SSH_PASSWORD"
            "WP_ROOT:OK_BERLIN_WP_ROOT"
          )
          for item in "${required[@]}"; do
            env_name="${item%%:*}"
            secret_name="${item##*:}"
            if [[ -z "${!env_name}" ]]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Install deploy tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp sshpass

      - name: Prepare known hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SFTP connection
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$SSH_USER","$SSH_PASSWORD" -p "$SSH_PORT" "sftp://$SSH_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x $SSH_OPTS"
          cls -1 "$WP_ROOT/wp-content/themes" >/dev/null
          bye
          EOF

      - name: Sync theme over SFTP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LOCAL_THEME/style.css"

          remote_parent="$WP_ROOT/wp-content/themes"
          remote_theme="$WP_ROOT/wp-content/themes/$THEME_NAME"

          sshpass -p "$SSH_PASSWORD" ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$remote_theme'" || {
              echo "Failed to create remote theme directory: $remote_theme"
              echo "Check OK_BERLIN_WP_ROOT and that $SSH_USER can write to: $remote_parent"
              lftp -u "$SSH_USER","$SSH_PASSWORD" -p "$SSH_PORT" "sftp://$SSH_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x $SSH_OPTS"
          set net:max-retries 2
          set net:timeout 20
          pwd
          cls -la "$remote_parent"
          bye
          EOF
              exit 1
            }

          lftp -u "$SSH_USER","$SSH_PASSWORD" -p "$SSH_PORT" "sftp://$SSH_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x $SSH_OPTS"
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --delete --verbose \
            --exclude-glob .DS_Store \
            --exclude-glob app/ \
            --exclude-glob conf/ \
            --exclude-glob logs/ \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .git/ \
            "$LOCAL_THEME/" "$remote_theme/"
          cls -1 "$remote_theme/style.css" >/dev/null
          echo "Deployed $THEME_NAME theme."
          bye
          EOF
