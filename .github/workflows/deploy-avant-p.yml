name: Deploy avant-p theme

on:
  push:
    branches:
      - main
    paths:
      - "avant-p/app/public/wp-content/themes/avan-p/**"
      - "avant-p/scripts/deploy-theme.sh"
      - ".github/workflows/deploy-avant-p.yml"
  workflow_dispatch:

concurrency:
  group: deploy-avant-p
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.AVANT_P_SSH_HOST }}
      SSH_USER: ${{ secrets.AVANT_P_SSH_USER }}
      SSH_KEY: ${{ secrets.AVANT_P_SSH_KEY }}
      SSH_PORT: ${{ secrets.AVANT_P_SSH_PORT || '22' }}
      WP_ROOT: ${{ secrets.AVANT_P_WP_ROOT }}
      THEME_NAME: avan-p

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SSH_HOST:AVANT_P_SSH_HOST"
            "SSH_USER:AVANT_P_SSH_USER"
            "SSH_KEY:AVANT_P_SSH_KEY"
            "WP_ROOT:AVANT_P_WP_ROOT"
          )
          for item in "${required[@]}"; do
            env_name="${item%%:*}"
            secret_name="${item##*:}"
            if [[ -z "${!env_name}" ]]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Ensure remote theme directory
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$WP_ROOT/wp-content/themes/$THEME_NAME'"

      - name: Sync theme
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude=".DS_Store" \
            --exclude="node_modules/" \
            --exclude=".git/" \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            "avant-p/app/public/wp-content/themes/$THEME_NAME/" \
            "$SSH_USER@$SSH_HOST:$WP_ROOT/wp-content/themes/$THEME_NAME/"

      - name: Confirm deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "test -f '$WP_ROOT/wp-content/themes/$THEME_NAME/style.css' && echo 'Deployed $THEME_NAME theme.'"
