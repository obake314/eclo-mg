name: Deploy baba_farm theme

on:
  push:
    branches:
      - main
    paths:
      - "baba_farm/**"
  workflow_dispatch:

concurrency:
  group: deploy-baba_farm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.BABA_FARM_SSH_HOST }}
      SSH_USER: ${{ secrets.BABA_FARM_SSH_USER }}
      SSH_PORT: ${{ secrets.BABA_FARM_SSH_PORT || '10022' }}
      WP_ROOT: ${{ secrets.BABA_FARM_WP_ROOT }}
      THEME_NAME: baba_farm
      LOCAL_THEME: baba_farm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SSH_HOST:BABA_FARM_SSH_HOST"
            "SSH_USER:BABA_FARM_SSH_USER"
            "WP_ROOT:BABA_FARM_WP_ROOT"
          )
          for item in "${required[@]}"; do
            env_name="${item%%:*}"
            secret_name="${item##*:}"
            if [[ -z "${!env_name}" ]]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BABA_FARM_SSH_KEY }}

      - name: Add known hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail
          ssh -vvv -p "$SSH_PORT" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o GSSAPIAuthentication=no \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH OK'" 2>&1 || true

      - name: Sync theme via rsync
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LOCAL_THEME/style.css"

          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15" \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='.git/' \
            "./$LOCAL_THEME/" \
            "$SSH_USER@$SSH_HOST:$WP_ROOT/wp-content/themes/$THEME_NAME/"

          echo "Deployed $THEME_NAME theme."
