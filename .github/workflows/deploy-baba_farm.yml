name: Deploy baba_farm theme

on:
  push:
    branches:
      - main
    paths:
      - "baba_farm/**"
  workflow_dispatch:

concurrency:
  group: deploy-baba_farm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.BABA_FARM_SSH_HOST }}
      SSH_USER: ${{ secrets.BABA_FARM_SSH_USER }}
      SSH_PORT: ${{ secrets.BABA_FARM_SSH_PORT || '10022' }}
      WP_ROOT: ${{ secrets.BABA_FARM_WP_ROOT }}
      THEME_NAME: baba_farm
      LOCAL_THEME: baba_farm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SSH_HOST:BABA_FARM_SSH_HOST"
            "SSH_USER:BABA_FARM_SSH_USER"
            "WP_ROOT:BABA_FARM_WP_ROOT"
          )
          for item in "${required[@]}"; do
            env_name="${item%%:*}"
            secret_name="${item##*:}"
            if [[ -z "${!env_name}" ]]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BABA_FARM_SSH_KEY }}

      - name: Add known hosts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Install lftp
        shell: bash
        run: sudo apt-get install -y lftp

      - name: Sync theme via SFTP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LOCAL_THEME/style.css"
          test -f "$LOCAL_THEME/index.php"

          remote_theme="$WP_ROOT/wp-content/themes/$THEME_NAME"
          ssh_opts="-o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -p $SSH_PORT"

          lftp -u "$SSH_USER"," " -p "$SSH_PORT" "sftp://$SSH_HOST" <<EOF
          set sftp:connect-program "ssh -a -x $ssh_opts"
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --delete --verbose \
            --exclude-glob .DS_Store \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .git/ \
            $LOCAL_THEME/ $remote_theme/
          cls -1 $remote_theme/style.css >/dev/null
          echo "Deployed $THEME_NAME theme."
          bye
          EOF
