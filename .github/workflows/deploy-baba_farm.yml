name: Deploy baba_farm theme

on:
  push:
    branches:
      - main
    paths:
      - "baba_farm/**"
  workflow_dispatch:

concurrency:
  group: deploy-baba_farm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SSH_HOST: ${{ secrets.BABA_FARM_SSH_HOST }}
      SSH_USER: ${{ secrets.BABA_FARM_SSH_USER }}
      SSH_PORT: ${{ secrets.BABA_FARM_SSH_PORT || '10022' }}
      WP_ROOT: ${{ secrets.BABA_FARM_WP_ROOT }}
      THEME_NAME: baba_farm
      LOCAL_THEME: baba_farm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "SSH_HOST:BABA_FARM_SSH_HOST"
            "SSH_USER:BABA_FARM_SSH_USER"
            "WP_ROOT:BABA_FARM_WP_ROOT"
          )
          for item in "${required[@]}"; do
            env_name="${item%%:*}"
            secret_name="${item##*:}"
            if [[ -z "${!env_name}" ]]; then
              echo "Missing required secret: $secret_name"
              exit 1
            fi
          done

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.BABA_FARM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Install deploy tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lftp

      - name: Test SFTP connection
        shell: bash
        run: |
          set -euo pipefail
          lftp -p "$SSH_PORT" "sftp://$SSH_USER@$SSH_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"
          cls -1 "$WP_ROOT/wp-content/themes" >/dev/null
          bye
          EOF

      - name: Sync theme over SFTP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$LOCAL_THEME/style.css"

          remote_theme="$WP_ROOT/wp-content/themes/$THEME_NAME"

          lftp -p "$SSH_PORT" "sftp://$SSH_USER@$SSH_HOST" <<EOF
          set cmd:fail-exit yes
          set sftp:connect-program "ssh -a -x -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15"
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror -R --delete --verbose \
            --exclude-glob .DS_Store \
            --exclude-glob node_modules/ \
            --exclude-glob vendor/ \
            --exclude-glob .git/ \
            "$LOCAL_THEME/" "$remote_theme/"
          cls -1 "$remote_theme/style.css" >/dev/null
          echo "Deployed $THEME_NAME theme."
          bye
          EOF
